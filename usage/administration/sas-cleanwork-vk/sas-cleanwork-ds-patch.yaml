# SAS Cleanwork DaemonSet Patch Configuration
# Patch 1 - Define the maximum age for WORK paths, in minutes. Any WORK paths found older than this will be deleted.
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: sas-cleanwork-ds-maxage-config
patch: |-
  - op: add
    path: /spec/template/spec/containers/0/env/-
    value: 
      name: MAX_WORK_AGE
      value: "{{ MAX_WORK_AGE }}"
target:
  kind: DaemonSet
  name: sas-cleanwork
# Patch 2 - Define the WORK volume for the DaemonSet.
---
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: sas-cleanwork-ds-volume-config
patch: |-
  - op: add
    path: /spec/template/spec/volumes/-
    value: 
      name: saswork
      {{ VOLUME-STORAGE-CLASS }}
target:
  kind: DaemonSet
  name: sas-cleanwork
---
apiVersion: builtin
kind: PatchTransformer
metadata:
  name: set-cleanwork-timer
# Patch 3 - Define the sleep timer for the DaemonSet. This controls how long the process should sleep between running the cleanup script.
patch: |-
  - op: add
    path: /spec/template/spec/containers/0/env/-
    value:
      name: CLEANWORK_SLEEP_TIMER_SECONDS
      value: "{{ SLEEP-TIME-IN-SECONDS }}"
target:
  kind: DaemonSet
  name: sas-cleanwork